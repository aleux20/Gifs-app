<h2 class="text-2xl font-bold mt-5">Buscar Gifs</h2>
<h3 class="text-sm text-gray-500">Encuentra los mejores gifs aquí</h3>

<section class="flex flex-col gap-4">
  <input
    type="text"
    placeholder="Buscar Gifs"
    class="mt-3 border border-gray-300 rounded-md p-2"
    (keyup.enter)="onSearch($event.target.value)"
  />
</section>

<div class="py-5">
  <app-gif-list [gifs]="gifs()" />
</div>
